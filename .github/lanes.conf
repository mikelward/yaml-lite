# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# The lane's test is "can this change what CI validates?". Markdown here is
# documentation and nothing else — nothing packages it, and README.md and
# AGENTS.md describe the parser rather than produce it — while everything
# else is code, including the parser, both test suites, the workflows, and
# this policy file itself (which the engine hard-codes as code regardless
# of what it says).
docs **/*.md

# The one subject prefix the docs lane accepts. The wider housekeeping table
# in AGENTS.md (test:, build:, refactor:) names categories this lane can
# never actually admit: every file it accepts is markdown, so a commit that
# really was test, build, or refactor work would carry a non-markdown file
# and ride the code lane instead.
prefixes docs

# ci.yml declares no workflow_dispatch trigger, so no dispatched run is
# legitimate here: a PR-less dispatch is refused on every ref.
dispatch-without-pr refuse
